version: 2
run:
  tests: true

linters:
  enable:
    - gocritic
    - errorlint
    - gomodguard
    - gosec       # Security checker
    - staticcheck # Advanced static analysis

linters-settings:
  gomodguard:
    blocked:
      modules:
        - github.com/pkg/errors:
            recommendations:
              - errors
            reason: "Use standard library errors package"
        - github.com/ghodss/yaml:
            recommendations:
              - gopkg.in/yaml.v3
            reason: "Deprecated, use yaml.v3"
      local_replace_directives: false

  gosec:
    excludes:
      - G104 # Audit errors not checked (too noisy)
    config:
      G101: "(?i)(?:passwd|password|secret|token)" # Token detection

issues:
  exclude:
    - composite
