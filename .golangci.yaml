version: 2
run:
  tests: true

linters:
  enable:
    - gocritic
    - errorlint
  disable:
    - depguard  # Disabled: depguard still blocking imports even with list-mode: lax

linters-settings:
  depguard:
    rules:
      main:
        list-mode: lax  # Allows everything unless denied
        files:
          - $all
          - "!$test"
        allow:
          - $gostd
          - github.com/afa7789/PK_scrambled_eggs
          - github.com/mattn/go-sqlite3
          - github.com/spf13/cobra
          - github.com/spf13/pflag
          - github.com/inconshreveable/mousetrap
        deny:
          - pkg: io/ioutil
            desc: "Replaced by io and os packages since Go 1.16"

issues:
  exclude:
    - composite
